services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped

    ports:
      - "127.0.0.1:13306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci

    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/storage/sql/mysql_schema.sql:/docker-entrypoint-initdb.d/01-tourapi.sql:ro
      - ./src/aihub/sql/aihub_schema.sql:/docker-entrypoint-initdb.d/02-aihub.sql:ro
      - ./src/aihub/sql/aihub_place_mapping.sql:/docker-entrypoint-initdb.d/03-mapping.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  chromadb:
    image: chromadb/chroma:1.5.9
    restart: unless-stopped

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - chroma-data:/data

    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8000
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql-data:
  chroma-data:
