name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: ci_travel
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-django-checks
      DJANGO_DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CORS_ALLOWED_ORIGINS: https://frontend.example.invalid
      CSRF_TRUSTED_ORIGINS: https://api.example.invalid
      ACCOUNT_DB_NAME: ci_accounts
      TRAVEL_DB_NAME: ci_travel
      MYSQL_DATABASE: ci_travel
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: ci
      MYSQL_PASSWORD: ci
      OPENAI_API_KEY: ci-placeholder
      CHROMA_MODE: http
      CHROMA_HOST: 127.0.0.1
      CHROMA_PORT: "8000"

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - name: Create CI databases
        run: |
          docker exec "${{ job.services.mysql.id }}" \
            mysql -uroot -pci-root -e "
              CREATE DATABASE IF NOT EXISTS ci_accounts
                CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
              GRANT ALL PRIVILEGES ON ci_accounts.* TO 'ci'@'%';
              GRANT ALL PRIVILEGES ON test_ci_accounts.* TO 'ci'@'%';
              GRANT ALL PRIVILEGES ON test_ci_travel.* TO 'ci'@'%';
              FLUSH PRIVILEGES;
            "
      - run: python backend/manage.py check --deploy --fail-level ERROR
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py migrate --database=default --noinput
      - run: python backend/manage.py migrate --database=default --check
      - run: python backend/manage.py test apps --noinput
      - run: python -m unittest discover -s tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: https://api.example.invalid
      VITE_GOOGLE_CLIENT_ID: ci-placeholder
      VITE_KAKAO_JAVASCRIPT_KEY: ci-placeholder
      VITE_KAKAO_LOGIN_JAVASCRIPT_KEY: ci-placeholder
      VITE_KAKAO_REDIRECT_URI: https://example.invalid/oauth/kakao/callback

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build --file backend/Dockerfile --tag tamrajeju-backend:ci .

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, container]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REPOSITORY: tourmain/backend
      ECS_CLUSTER: tourmain-production
      ECS_SERVICE: tourmain-backend
      ECS_CONTAINER_NAME: backend
      ECS_TEST_HEADER: X-Tourmain-Deployment
      FRONTEND_S3_BUCKET: tourmain-frontend-511092105773
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      VITE_API_BASE_URL: https://d9mejd7qkrml.cloudfront.net
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      VITE_KAKAO_JAVASCRIPT_KEY: ${{ vars.VITE_KAKAO_JAVASCRIPT_KEY }}
      VITE_KAKAO_LOGIN_JAVASCRIPT_KEY: ${{ vars.VITE_KAKAO_LOGIN_JAVASCRIPT_KEY }}
      VITE_KAKAO_REDIRECT_URI: https://d9mejd7qkrml.cloudfront.net/oauth/kakao/callback

    steps:
      - uses: actions/checkout@v6

      - name: Validate deployment variables
        shell: bash
        run: |
          required=(
            AWS_ROLE_ARN CLOUDFRONT_DISTRIBUTION_ID
            VITE_GOOGLE_CLIENT_ID VITE_KAKAO_JAVASCRIPT_KEY
            VITE_KAKAO_LOGIN_JAVASCRIPT_KEY
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            printf 'Missing GitHub Actions variable: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        shell: bash
        run: |
          IMAGE_URI="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:deploy-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --file backend/Dockerfile --tag "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Register task definition
        shell: bash
        run: |
          CURRENT_TASK_DEFINITION=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)
          echo "PREVIOUS_TASK_DEFINITION=$CURRENT_TASK_DEFINITION" >> "$GITHUB_ENV"

          aws ecs describe-task-definition \
            --task-definition "$CURRENT_TASK_DEFINITION" \
            --query taskDefinition \
            --output json \
            | jq 'del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )' > task-definition.json

          jq -e --arg name "$ECS_CONTAINER_NAME" \
            'any(.containerDefinitions[]; .name == $name)' \
            task-definition.json > /dev/null

          jq --arg name "$ECS_CONTAINER_NAME" --arg image "$IMAGE_URI" \
            '(.containerDefinitions[] | select(.name == $name) | .image) = $image' \
            task-definition.json > rendered-task-definition.json

          NEW_TASK_DEFINITION=$(aws ecs register-task-definition \
            --cli-input-json file://rendered-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "NEW_TASK_DEFINITION=$NEW_TASK_DEFINITION" >> "$GITHUB_ENV"

      - name: Run migrations and data readiness checks
        shell: bash
        run: |
          NETWORK_CONFIGURATION=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].networkConfiguration' \
            --output json)
          OVERRIDES=$(jq -nc --arg name "$ECS_CONTAINER_NAME" '{
            containerOverrides: [{
              name: $name,
              command: [
                "sh", "-c",
                "python backend/manage.py migrate --database=default --noinput && "
                + "python -m scripts.storage.migrate_package_catalog && "
                + "python scripts/verify_rds.py && "
                + "python -m scripts.indexing.build_tourapi_vector_index --prune && "
                + "python scripts/verify_chroma.py"
              ]
            }]
          }')

          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$NEW_TASK_DEFINITION" \
            --network-configuration "$NETWORK_CONFIGURATION" \
            --overrides "$OVERRIDES" \
            --query 'tasks[0].taskArn' \
            --output text)

          if [[ -z "$TASK_ARN" || "$TASK_ARN" == "None" ]]; then
            echo "Failed to start the migration task" >&2
            exit 1
          fi

          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --query "tasks[0].containers[?name=='$ECS_CONTAINER_NAME'].exitCode | [0]" \
            --output text)

          if [[ "$EXIT_CODE" != "0" ]]; then
            aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
            exit 1
          fi

      - name: Deploy backend
        shell: bash
        run: |
          rollback_backend() {
            CURRENT_TASK_DEFINITION=$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --query 'services[0].taskDefinition' \
              --output text)

            if [[ "$CURRENT_TASK_DEFINITION" != "$PREVIOUS_TASK_DEFINITION" ]]; then
              aws ecs update-service \
                --cluster "$ECS_CLUSTER" \
                --service "$ECS_SERVICE" \
                --task-definition "$PREVIOUS_TASK_DEFINITION" > /dev/null
            fi

            aws ecs wait services-stable \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE"
          }

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$NEW_TASK_DEFINITION" > /dev/null

          if ! {
            curl --fail --silent --show-error \
              --header "$ECS_TEST_HEADER: green" \
              --retry 30 --retry-delay 5 --retry-all-errors \
              "${VITE_API_BASE_URL%/}/ready/" > /dev/null &&
            aws ecs wait services-stable \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" &&
            curl --fail --silent --show-error \
              --retry 5 --retry-delay 5 --retry-all-errors \
              "${VITE_API_BASE_URL%/}/ready/" > /dev/null;
          }; then
            rollback_backend
            exit 1
          fi

          DEPLOYED_TASK_DEFINITION=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          if [[ "$DEPLOYED_TASK_DEFINITION" != "$NEW_TASK_DEFINITION" ]]; then
            echo "ECS rolled back the deployment to $DEPLOYED_TASK_DEFINITION" >&2
            rollback_backend
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy frontend
        run: |
          aws s3 sync frontend/dist "s3://$FRONTEND_S3_BUCKET" --delete
          aws s3 cp frontend/dist/index.html \
            "s3://$FRONTEND_S3_BUCKET/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths '/*' > /dev/null
