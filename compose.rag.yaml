name: skn28-rag

x-rag-environment: &rag-environment
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  CHROMA_MODE: persistent
  CHROMA_PERSIST_DIRECTORY: /app/data/vectorstore
  AIHUB_DATA_DIRECTORY: /app/data/processed/aihub
  PYTHONUNBUFFERED: "1"

x-rag-volumes: &rag-volumes
  - ./data/raw:/app/data/raw:ro
  - ./data/processed:/app/data/processed:ro
  - rag_chroma_data:/app/data/vectorstore

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE must be set in .env}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER must be set in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "${DOCKER_MYSQL_PORT:-3307}:3306"
    volumes:
      - rag_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  rag-init:
    build:
      context: .
      dockerfile: Dockerfile.rag
    env_file:
      - .env
    environment:
      <<: *rag-environment
    volumes: *rag-volumes
    depends_on:
      mysql:
        condition: service_healthy
    command: ["python", "-m", "docker.rag_bootstrap"]
    restart: "no"

  rag-ui:
    build:
      context: .
      dockerfile: Dockerfile.rag
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      <<: *rag-environment
    volumes: *rag-volumes
    ports:
      - "${DOCKER_RAG_PORT:-8501}:8501"
    depends_on:
      mysql:
        condition: service_healthy
      rag-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8501/_stcore/health', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  rag-health:
    build:
      context: .
      dockerfile: Dockerfile.rag
    profiles: ["tools"]
    env_file:
      - .env
    environment:
      <<: *rag-environment
    volumes: *rag-volumes
    depends_on:
      mysql:
        condition: service_healthy
      rag-init:
        condition: service_completed_successfully
    command: ["python", "-m", "docker.rag_healthcheck"]
    restart: "no"

volumes:
  rag_mysql_data:
  rag_chroma_data:
